name: Build and test

on:
  push:
    branches: [master, "codex/**"]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "25"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

  artifact:
    name: Java 21 release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build
        run: ./mvnw --batch-mode --no-transfer-progress clean package
      - name: Create checksum
        run: sha256sum target/ProtectionStones-2.10.6-pvc.1.jar > target/ProtectionStones-2.10.6-pvc.1.jar.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ProtectionStones-2.10.6-pvc.1
          path: |
            target/ProtectionStones-2.10.6-pvc.1.jar
            target/ProtectionStones-2.10.6-pvc.1.jar.sha256
          if-no-files-found: error
