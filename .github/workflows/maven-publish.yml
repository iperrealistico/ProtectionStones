name: Release artifact

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify
      - name: Create checksum
        run: sha256sum target/ProtectionStones-2.10.6-pvc.1.jar > target/ProtectionStones-2.10.6-pvc.1.jar.sha256
      - name: Attach release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.event.release.tag_name }}"
          target/ProtectionStones-2.10.6-pvc.1.jar
          target/ProtectionStones-2.10.6-pvc.1.jar.sha256
          --clobber
